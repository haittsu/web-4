<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Bootstrap Form Styling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <main class="container py-4">
    <nav class="nav mb-4" aria-label="Tasks">
      <a class="nav-link" href="index.html">Task 0</a>
      <a class="nav-link" href="task1.html">Task 1</a>
      <a class="nav-link active" href="task2.html" aria-current="page">Task 2</a>
      <a class="nav-link" href="task3.html">Task 3</a>
    </nav>

    <h1 class="mb-4">Task 2. Bootstrap Form Styling</h1>

    <form class="row g-3">
      <div class="col-12 col-md-6">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Your full name" required maxlength="80" aria-describedby="name-help">
        <div id="name-help" class="form-text">Enter your name, up to 80 characters.</div>
      </div>
      <div class="col-12 col-md-6">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required maxlength="254" aria-describedby="email-help">
        <div id="email-help" class="form-text">Enter an email address, such as you@example.com.</div>
      </div>
      <div class="col-12">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here" required maxlength="1000" aria-describedby="message-help"></textarea>
        <div id="message-help" class="form-text">Enter your message, up to 1,000 characters.</div>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </main>
</body>
</html>
